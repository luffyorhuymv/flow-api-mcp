services:
  flow-api:
    build: .
    image: flow-api-mcp:local
    container_name: flow-api-mcp
    restart: unless-stopped
    environment:
      - USE_SYSTEM_CHROME=true
      - HEADLESS=true
      - USE_XVFB=false
    volumes:
      - flow-data:/app/data
      - flow-output:/app/output
    stdin_open: true
    tty: true
    deploy:
      resources:
        limits:
          memory: 2G

  # Optional service: same image but with Xvfb (use if headless=new gets 403)
  flow-api-xvfb:
    profiles: ["xvfb"]
    image: flow-api-mcp:local
    environment:
      - USE_SYSTEM_CHROME=true
      - HEADLESS=false
      - USE_XVFB=true
    volumes:
      - flow-data:/app/data
      - flow-output:/app/output
    stdin_open: true
    tty: true
    deploy:
      resources:
        limits:
          memory: 2G

  # Native HTTP/SSE transport (StreamableHTTP), perfect for Cloudflare Tunnel
  flow-api-http:
    profiles: ["http"]
    build: .
    container_name: flow-api-http
    restart: unless-stopped
    environment:
      - USE_SYSTEM_CHROME=true
      - HEADLESS=true
      - USE_XVFB=false
      - HTTP_HOST=0.0.0.0
      - HTTP_AUTH_TOKEN=${HTTP_AUTH_TOKEN:-}
    command: ["serve-http", "5555"]
    volumes:
      - flow-data:/app/data
      - flow-output:/app/output
    ports:
      - "127.0.0.1:5555:5555"
    deploy:
      resources:
        limits:
          memory: 2G

volumes:
  flow-data:
  flow-output:
